syntax = "proto3";

package ai.pipestream.microsoft.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.microsoft.v1";

// ============================================================================
// MICROSOFT GRAPH DOMAIN MODEL - shared sub-structures.
//
// This package is a domain model of the Microsoft Graph v1.0 SharePoint and
// OneDrive surface (sites, drives, driveItems, lists, listItems, columns,
// content types, permissions, versions), not a serialization of REST response
// shapes. OData annotations (@odata.*, @microsoft.graph.*) and pagination
// transport (@odata.nextLink) are deliberately absent; list rpcs stream and
// delta rpcs surface @odata.deltaLink as a typed resume cursor. Graph facets
// (file, folder, deleted, shared, remoteItem, ...) become sub-messages whose
// presence carries the same meaning as the facet's presence in Graph.
//
// Graph declares most of its enumerations as open strings (driveType, link
// scope, roles, list template, ...). Those stay strings here so an unknown
// upstream value is never lost; only values Graph itself declares as closed
// OData enums become protobuf enums.
//
// Entity messages live in site.proto, drive.proto, list.proto and
// permission.proto; the crawl envelopes live in events.proto.
// ============================================================================

// A Microsoft Graph identity: user, device, group, or application.
message Identity {
  // Graph object id of the identity (directory object id for users, groups
  // and applications).
  string id = 1;
  // Display name of the identity as Graph recorded it; may be stale.
  string display_name = 2;
  // Email address Graph adds to user identities on SharePoint and OneDrive
  // for Business items (an open property outside the `identity` schema);
  // empty when Graph omitted it.
  string email = 3;
}

// Identity set on a Graph item (createdBy / lastModifiedBy / owner).
message IdentitySet {
  // User identity, when the actor is a user.
  Identity user = 1;
  // Application identity, when the actor is an app.
  Identity application = 2;
  // Device identity, when the actor is a device.
  Identity device = 3;
  // Group identity, when the actor or owner is a Microsoft 365 group (for
  // example the `owner` of a group or Teams drive).
  Identity group = 4;
}

// A SharePoint-scoped identity (the `sharePointIdentity` type): a site user or
// site group whose id is unique only within the site collection.
message SharePointIdentity {
  // SharePoint principal id (unique within the site collection).
  string id = 1;
  // Display name of the principal.
  string display_name = 2;
  // SharePoint sign-in (login) name, e.g. `i:0#.f|membership|user@tenant`.
  string login_name = 3;
}

// A SharePoint group identified by a tenant-wide id (the
// `sharePointGroupIdentity` type). Graph recommends it over `siteGroup`.
message SharePointGroupIdentity {
  // Globally unique id of the SharePoint group.
  string id = 1;
  // Display name of the group.
  string display_name = 2;
  // Principal id of the SharePoint group in the tenant.
  string principal_id = 3;
  // Title of the SharePoint group.
  string title = 4;
}

// Identity set with SharePoint principals (the `sharePointIdentitySet` type),
// used on permissions. The directory identities (user/group/application) are
// what an indexer resolves for security trimming; the site-scoped principals
// identify SharePoint-only groups that have no Entra object.
message SharePointIdentitySet {
  // Entra user, when the grantee is a user.
  Identity user = 1;
  // Application, when the grantee is an app.
  Identity application = 2;
  // Device, when the grantee is a device.
  Identity device = 3;
  // Entra (Microsoft 365 / security) group, when the grantee is a group.
  Identity group = 4;
  // SharePoint site user record for the same principal, when known.
  SharePointIdentity site_user = 5;
  // SharePoint site group identified by a site-scoped principal id.
  SharePointIdentity site_group = 6;
  // SharePoint group identified by a tenant-wide id; preferred over
  // site_group when both are present.
  SharePointGroupIdentity share_point_group = 7;
}

// A Microsoft Graph user (the /me or /users shape we keep).
message GraphUser {
  // Graph object id.
  string id = 1;
  // Display name.
  string display_name = 2;
  // User principal name (email-shaped).
  string user_principal_name = 3;
  // Mail address when present; empty when omitted.
  string mail = 4;
  // Given (first) name, empty when omitted.
  string given_name = 5;
  // Surname (last name), empty when omitted.
  string surname = 6;
  // Job title, empty when omitted.
  string job_title = 7;
  // Department, empty when omitted.
  string department = 8;
  // Office location, empty when omitted.
  string office_location = 9;
  // User type: `Member` or `Guest`; empty when omitted. Guests matter for
  // security trimming because sharing to them is external sharing.
  string user_type = 10;
  // Whether the account is enabled; unset when Graph omitted it.
  optional bool account_enabled = 11;
  // Preferred language (BCP 47), empty when omitted.
  string preferred_language = 12;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// SharePoint REST-compatible identifiers of an item (the `sharepointIds`
// facet). These are the keys an enterprise indexer needs to join Graph data
// with SharePoint search, audit logs, and CSOM/REST exports.
message SharepointIds {
  // GUID of the list that contains the item.
  string list_id = 1;
  // Integer id of the item within its list, as a string.
  string list_item_id = 2;
  // GUID of the item within OneDrive for Business or SharePoint.
  string list_item_unique_id = 3;
  // GUID of the site collection (SPSite).
  string site_id = 4;
  // SharePoint URL of the site that contains the item.
  string site_url = 5;
  // GUID of the tenancy.
  string tenant_id = 6;
  // GUID of the site (SPWeb).
  string web_id = 7;
}

// A reference to an item's parent, or to the item a permission or content
// type was inherited from (the `itemReference` type).
message ItemReference {
  // Drive id that contains the referenced item; empty outside drives.
  string drive_id = 1;
  // Drive type of that drive (personal, business, documentLibrary).
  string drive_type = 2;
  // Id of the referenced driveItem or listItem.
  string id = 3;
  // Name of the referenced item.
  string name = 4;
  // Percent-encoded path of the referenced item (`/drive/root:/Folder`).
  // Graph does not populate it in delta responses.
  string path = 5;
  // Share id when the reference was reached through the shares API.
  string share_id = 6;
  // Site id that contains the parent document library (OneDrive for
  // Business and SharePoint only).
  string site_id = 7;
  // SharePoint identifiers of the referenced item, when Graph returned them.
  SharepointIds sharepoint_ids = 8;
}

// Content hashes Graph reports on a file (the `file.hashes` object).
message FileHashes {
  // SHA-1 hex digest, empty when Graph omitted it.
  string sha1 = 1;
  // SHA-256 hex digest, empty when Graph omitted it. Graph documents this
  // property as unsupported; it is kept for wire compatibility.
  string sha256 = 2;
  // QuickXOR hash (Graph's SharePoint hash), empty when omitted.
  string quick_xor = 3;
  // CRC32 hash, empty when omitted.
  string crc32 = 4;
}

// One SharePoint list-item column (one entry of a `fieldValueSet`). Nested
// objects are flattened into dotted names (`Parent.Child`, at any depth);
// arrays of objects (multi-value lookups, managed-metadata terms, people)
// become one column per object property whose `string_values` hold that
// property of every element in order; `@odata.*` annotations are skipped. No
// JSON/Struct arm: every leaf value lands in a typed arm.
message ListColumn {
  // SharePoint internal column name (for example `FileLeafRef`).
  string name = 1;
  // The column value. Exactly one arm is set when the column has a value.
  oneof value {
    // Text, choice, lookup display name, or a joined multi-value list.
    string string_value = 2;
    // Integral number (Graph integer / whole JSON number).
    int64 int_value = 3;
    // Floating-point number.
    double double_value = 4;
    // Boolean column.
    bool bool_value = 5;
    // Date-only or date-time column parsed as RFC3339.
    google.protobuf.Timestamp timestamp_value = 6;
  }
  // The individual values of a multi-value column (multi-choice, multi-lookup,
  // multi-person). Set alongside the joined `string_value`, which stays for
  // compatibility; empty for single-value columns.
  repeated string string_values = 7;
}

// Identity of a SharePoint content type as carried on items (the
// `contentTypeInfo` type).
message ContentTypeInfo {
  // Content type id (e.g. `0x0101...`).
  string id = 1;
  // Content type name (e.g. `Document`).
  string name = 2;
}

// The `deleted` facet: present on items returned by a delta enumeration (or
// by a sync pass) that were deleted upstream.
message Deleted {
  // State of the deleted item as Graph reports it (`deleted`, ...).
  string state = 1;
}

// Publication (versioning) state of an item or version (the
// `publicationFacet` type). Only returned when requested via $select.
message PublicationFacet {
  // `published` or `checkout`.
  string level = 1;
  // The version id visible to the current caller.
  string version_id = 2;
  // Who has the file checked out, when level is `checkout`.
  IdentitySet checked_out_by = 3;
}

// Client-side file system timestamps (the `fileSystemInfo` facet). These are
// the timestamps users see; `created_at` / `last_modified_at` on the item are
// the service-side ones.
message FileSystemInfo {
  // When the file was created on the client.
  google.protobuf.Timestamp created_at = 1;
  // When the file was last modified on the client.
  google.protobuf.Timestamp last_modified_at = 2;
  // When the file was last accessed; recent-files listings only.
  google.protobuf.Timestamp last_accessed_at = 3;
}

// A reference to one drive item by drive and item id.
message DriveItemRef {
  // Drive id that owns the item.
  string drive_id = 1;
  // Item id within the drive.
  string item_id = 2;
}

// A reference to one SharePoint list by site and list id.
message ListRef {
  // Site id that owns the list.
  string site_id = 1;
  // List id within the site.
  string list_id = 2;
}

// A reference to one SharePoint list item by site, list and item id.
message ListItemRef {
  // Site id that owns the list.
  string site_id = 1;
  // List id within the site.
  string list_id = 2;
  // List item id within the list.
  string item_id = 3;
}
