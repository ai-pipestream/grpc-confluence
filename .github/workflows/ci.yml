name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_write:
        description: Run the live write test against the real Confluence workspace and record it
        type: boolean
        default: false

# The shared core (ai-pipestream/grpc-integration) is checked out next to
# this repo and included as a Gradle composite build (-PintegrationDir), so
# CI never needs the Forgejo registry. Both checkouts live under the
# workspace: actions/checkout cannot write outside it.
env:
  INTEGRATION_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PintegrationDir=../grpc-integration
        working-directory: grpc-confluence

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticated release lookups; anonymous ones get rate-limited
          # and fail before lint runs.
          github_token: ${{ github.token }}
      - name: buf lint STANDARD+COMMENTS
        run: buf lint

  # Read-only live probes. Fork PRs never see secrets (job is skipped).
  # Same-repo PRs / pushes / dispatch run the job; if the secret is empty
  # the step exits 0 so a repo without credentials stays green.
  live-confluence:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Confluence smoke
        working-directory: grpc-confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACES: ${{ secrets.CONFLUENCE_SPACES }}
        run: |
          if [ -z "${CONFLUENCE_EMAIL}" ] || [ -z "${CONFLUENCE_API_TOKEN}" ]; then
            echo "Confluence secrets not configured; skipping live smoke"
            exit 0
          fi
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveSmokeTest

  # Writes to the real workspace and records the exchanges. Only ever started
  # by hand: a workflow_dispatch with run_live_write set.
  live-confluence-write:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Confluence write run
        working-directory: grpc-confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_LIVE_WRITE: "1"
          CONFLUENCE_SPACE_KEY: CLAUDEGRPC
        run: |
          if [ -z "${CONFLUENCE_EMAIL}" ] || [ -z "${CONFLUENCE_API_TOKEN}" ]; then
            echo "Confluence secrets not configured; the live write run needs them"
            exit 1
          fi
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveWriteTest
      - name: Report
        if: always()
        working-directory: grpc-confluence
        run: |
          if [ -f grpc-confluence-service/build/live-write.md ]; then
            cat grpc-confluence-service/build/live-write.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No live write report was written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-write-report
          path: grpc-confluence/grpc-confluence-service/build/live-write.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confluence-recordings
          path: grpc-confluence/grpc-confluence-service/src/test/resources/recordings/
          if-no-files-found: warn
