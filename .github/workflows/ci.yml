name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_live_confluence:
        description: Fail unless the read-only Confluence live smoke actually passes
        type: boolean
        default: false

# The shared core (ai-pipestream/grpc-integration) is checked out next to
# this repo and included as a Gradle composite build (-PintegrationDir), so
# CI never needs the Forgejo registry. Both checkouts live under the
# workspace: actions/checkout cannot write outside it.
env:
  INTEGRATION_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - name: Test live gate branches offline
        run: python3 scripts/test_confluence_live_gate.py
        working-directory: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PintegrationDir=../grpc-integration
        working-directory: grpc-confluence

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticated release lookups; anonymous ones get rate-limited
          # and fail before lint runs.
          github_token: ${{ github.token }}
      - name: buf lint STANDARD+COMMENTS
        run: buf lint

  # Fork PRs never enter either credential-bearing job. Optional runs report
  # missing credentials explicitly; dispatch can require actual live evidence.
  live-confluence-preflight:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check live credentials without printing them
        id: credentials
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_confluence }}
        shell: bash
        run: |
          if [[ -z "${CONFLUENCE_EMAIL//[[:space:]]/}" || -z "${CONFLUENCE_API_TOKEN//[[:space:]]/}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$REQUIRE_LIVE" == "true" ]]; then
              echo "::error::Required Confluence live gate has no credentials; no live evidence produced."
              echo "Confluence live gate: FAILED (required credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Confluence live smoke: SKIPPED (credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  live-confluence:
    needs: live-confluence-preflight
    if: needs.live-confluence-preflight.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Confluence smoke
        working-directory: grpc-confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACES: ${{ secrets.CONFLUENCE_SPACES }}
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveSmokeTest --rerun-tasks
      - name: Require executed live evidence
        working-directory: grpc-confluence
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("grpc-confluence-service/build/test-results/liveSmokeTest/TEST-ai.pipestream.confluence.ConfluenceLiveSmokeIT.xml")
          if not report.is_file():
              raise SystemExit("Missing Confluence live smoke report; no live evidence.")
          cases = ET.parse(report).getroot().findall("testcase")
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Confluence live smoke did not execute successfully; no live evidence.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Confluence live smoke: PASSED ({len(cases)} executed tests, none skipped).\n")
          PYTHON
