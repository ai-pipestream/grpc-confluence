name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_write:
        description: Run the live write test against the real Confluence workspace and record it
        type: boolean
        default: false
      live_write_admin:
        description: With run_live_write, also run the site-level steps (a throwaway space, space roles, the admin key)
        type: boolean
        default: false
      import_recordings_run_id:
        description: Commit the confluence-recordings artifact of this run id to the branch as replay data
        type: string
        default: ""
      run_live_changes:
        description: Deploy the Forge app to the test site, run the live change feed test and record it
        type: boolean
        default: false
      probe_confluence_account:
        description: Report whether the Confluence test account is an admin (read-only, prints no names)
        type: boolean
        default: false
      require_live_confluence:
        description: Fail unless the read-only Confluence live smoke actually passes
        type: boolean
        default: false

# The shared core (ai-pipestream/grpc-integration) is checked out next to
# this repo and included as a Gradle composite build (-PintegrationDir), so
# CI never needs the Forgejo registry. Both checkouts live under the
# workspace: actions/checkout cannot write outside it.
env:
  INTEGRATION_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - name: Test live gate branches offline
        run: python3 scripts/test_confluence_live_gate.py
        working-directory: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PintegrationDir=../grpc-integration
        working-directory: grpc-confluence

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticated release lookups; anonymous ones get rate-limited
          # and fail before lint runs.
          github_token: ${{ github.token }}
      - name: buf lint STANDARD+COMMENTS
        run: buf lint

  # Fork PRs never enter either credential-bearing job. Optional runs report
  # missing credentials explicitly; dispatch can require actual live evidence.
  live-confluence-preflight:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check live credentials without printing them
        id: credentials
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_confluence }}
        shell: bash
        run: |
          if [[ -z "${CONFLUENCE_EMAIL//[[:space:]]/}" || -z "${CONFLUENCE_API_TOKEN//[[:space:]]/}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$REQUIRE_LIVE" == "true" ]]; then
              echo "::error::Required Confluence live gate has no credentials; no live evidence produced."
              echo "Confluence live gate: FAILED (required credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Confluence live smoke: SKIPPED (credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  live-confluence:
    needs: live-confluence-preflight
    if: needs.live-confluence-preflight.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Confluence smoke
        working-directory: grpc-confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACES: ${{ secrets.CONFLUENCE_SPACES }}
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveSmokeTest --rerun-tasks
      - name: Require executed live evidence
        working-directory: grpc-confluence
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("grpc-confluence-service/build/test-results/liveSmokeTest/TEST-ai.pipestream.confluence.ConfluenceLiveSmokeIT.xml")
          if not report.is_file():
              raise SystemExit("Missing Confluence live smoke report; no live evidence.")
          cases = ET.parse(report).getroot().findall("testcase")
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Confluence live smoke did not execute successfully; no live evidence.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Confluence live smoke: PASSED ({len(cases)} executed tests, none skipped).\n")
          PYTHON

  # Writes to the real workspace and records the exchanges. Only ever started
  # by hand: a workflow_dispatch with run_live_write set. It does not wait for
  # build: a change to the scenarios fails the replay there until this job has
  # recorded again, and this job compiles the service itself.
  live-confluence-write:
    needs: buf
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Confluence write run
        working-directory: grpc-confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_LIVE_WRITE: "1"
          CONFLUENCE_LIVE_WRITE_ADMIN: ${{ inputs.live_write_admin && '1' || '' }}
          CONFLUENCE_SPACE_KEY: CLAUDEGRPC
        run: |
          if [ -z "${CONFLUENCE_EMAIL}" ] || [ -z "${CONFLUENCE_API_TOKEN}" ]; then
            echo "Confluence secrets not configured; the live write run needs them"
            exit 1
          fi
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveWriteTest
      - name: Report
        if: always()
        working-directory: grpc-confluence
        run: |
          if [ -f grpc-confluence-service/build/live-write.md ]; then
            cat grpc-confluence-service/build/live-write.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No live write report was written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-write-report
          path: grpc-confluence/grpc-confluence-service/build/live-write.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confluence-recordings
          path: grpc-confluence/grpc-confluence-service/src/test/resources/recordings/
          if-no-files-found: warn

  # Deploys grpc-confluence-forge to the test site with a fresh queue secret,
  # then runs the change feed against it. Only ever started by hand.
  live-confluence-changes:
    needs: buf
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_changes
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL || secrets.CONFLUENCE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN || secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy the Forge app and open its queue
        working-directory: grpc-confluence/grpc-confluence-forge
        run: |
          if [ -z "${FORGE_EMAIL}" ] || [ -z "${FORGE_API_TOKEN}" ] || [ -z "${CONFLUENCE_BASE_URL}" ]; then
            echo "Forge or Confluence secrets not configured"
            exit 1
          fi
          npm ci --no-audit --no-fund
          npm test
          npm install -g --no-audit --no-fund @forge/cli@15.1.0
          forge settings set usage-analytics false
          site=$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlparse(os.environ["CONFLUENCE_BASE_URL"]).hostname)')
          if grep -q 'app/00000000-0000-0000-0000-000000000000' manifest.yml; then
            if ! forge developer-spaces list 2>/dev/null | grep -qi pipestream; then
              # register asks for a Developer Space name when the login has none; answer it on a pseudo-terminal.
              printf 'pipestream\n' | script -qec "forge register -y pipestream-confluence-events" /dev/null
            else
              forge register -y pipestream-confluence-events
            fi
            grep -q 'app/00000000-0000-0000-0000-000000000000' manifest.yml && { echo "register did not write an app id"; exit 1; }
            echo "Registered app id (commit it to manifest.yml): $(grep -o 'ari:cloud:ecosystem::app/[0-9a-f-]*' manifest.yml)"
          fi
          cp manifest.yml "$RUNNER_TEMP/manifest.yml"
          secret=$(openssl rand -hex 32)
          echo "::add-mask::${secret}"
          forge variables set -e development --encrypt QUEUE_SECRET "${secret}"
          forge deploy -e development --non-interactive
          if ! forge install -e development --product confluence --site "${site}" --non-interactive --confirm-scopes --verbose; then
            forge install -e development --product confluence --site "${site}" --non-interactive --confirm-scopes --upgrade
          fi
          url=$(forge webtrigger create -e development -f event-queue -s "${site}" -p confluence | grep -o 'https://[^[:space:]]*' | head -1)
          if [ -z "${url}" ]; then
            echo "no web trigger URL"
            exit 1
          fi
          echo "::add-mask::${url}"
          printf '%s' "${url}" > "$RUNNER_TEMP/queue.url"
          printf '%s' "${secret}" > "$RUNNER_TEMP/queue.secret"
      - name: Live Confluence change run
        working-directory: grpc-confluence
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_LIVE_CHANGES: "1"
          CONFLUENCE_SPACE_KEY: CLAUDEGRPC
        run: |
          export CONFLUENCE_FORGE_QUEUE_URL="$(cat "$RUNNER_TEMP/queue.url")"
          export CONFLUENCE_FORGE_QUEUE_SECRET="$(cat "$RUNNER_TEMP/queue.secret")"
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:liveChangesTest
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("grpc-confluence-service/build/test-results/liveChangesTest/TEST-ai.pipestream.confluence.ConfluenceLiveChangeIT.xml")
          if not report.exists():
              raise SystemExit("Missing live change report; no live evidence.")
          suite = ET.parse(report).getroot()
          if int(suite.get("skipped", "0")) or int(suite.get("tests", "0")) == 0:
              raise SystemExit("The live change test was skipped; no live evidence.")
          PY
      - name: Report
        if: always()
        working-directory: grpc-confluence
        run: |
          if [ -f grpc-confluence-service/build/live-changes.md ]; then
            cat grpc-confluence-service/build/live-changes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No live change report was written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-manifest
          path: ${{ runner.temp }}/manifest.yml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-changes-report
          path: |
            grpc-confluence/grpc-confluence-service/build/live-changes.md
            grpc-confluence/grpc-confluence-service/build/test-results/liveChangesTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confluence-recordings
          path: grpc-confluence/grpc-confluence-service/src/test/resources/recordings/
          if-no-files-found: warn

  # Copies the recordings a live write run uploaded into the branch, after a
  # leak check and the recordings guard test. Only ever started by hand.
  import-confluence-recordings:
    if: github.event_name == 'workflow_dispatch' && inputs.import_recordings_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-confluence
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - name: Drop the previous recordings
        run: |
          rm -rf grpc-confluence/grpc-confluence-service/src/test/resources/recordings/confluence \
            grpc-confluence/grpc-confluence-service/src/test/resources/recordings/confluence-changes
      - uses: actions/download-artifact@v4
        with:
          name: confluence-recordings
          run-id: ${{ inputs.import_recordings_run_id }}
          github-token: ${{ github.token }}
          path: grpc-confluence/grpc-confluence-service/src/test/resources/recordings/
      - name: Leak check
        working-directory: grpc-confluence/grpc-confluence-service/src/test/resources/recordings
        run: |
          git checkout -- README.md
          echo "files: $(find . -type f | wc -l)"
          fail=0
          check() {
            n=$(grep -rIlE --exclude=README.md -e "$2" . | wc -l)
            echo "$1: $n files"
            if [ "$n" -gt 0 ]; then grep -rIlE --exclude=README.md -e "$2" . | head -20; fail=1; fi
          }
          check "api token" 'ATATT'
          check "basic credential" 'Basic [A-Za-z0-9+/=]{8,}'
          check "bearer credential" 'Bearer [A-Za-z0-9._-]{8,}'
          check "cookie value" '"(set-)?cookie"[[:space:]]*:'
          # Placeholder addresses the scrubber wrote are fine; any other address is a leak.
          n=$(grep -rIhoE --exclude=README.md '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' . | grep -vcE '@example\.invalid$' || true)
          echo "email address: $n matches outside the placeholder domain"
          if [ "$n" -gt 0 ]; then
            grep -rIlE --exclude=README.md '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' . | head -20
            fail=1
          fi
          echo "site host mentions: $(grep -rIlE --exclude=README.md 'atlassian\.net' . | wc -l) files"
          exit $fail
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Guard and replay tests on the imported recordings
        id: tests
        continue-on-error: true
        working-directory: grpc-confluence
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:test \
            --tests '*RecordingsGuardTest' --tests '*ConfluenceWriteReplayTest' \
            --tests '*ConfluenceChangeReplayTest'
      - name: Guard test alone decides whether the data may be committed
        if: steps.tests.outcome == 'failure'
        working-directory: grpc-confluence
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-confluence-service:test \
            --tests '*RecordingsGuardTest'
      - name: Commit the recordings
        working-directory: grpc-confluence
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ inputs.import_recordings_run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grpc-confluence-service/src/test/resources/recordings
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add recorded Confluence exchanges from live run ${RUN_ID}"
          git push origin "HEAD:${BRANCH}"

  probe-confluence-account:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_confluence_account
    runs-on: ubuntu-latest
    steps:
      - name: Report the account's rights (read-only)
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          get() { curl -sS -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -H 'Accept: application/json' "$CONFLUENCE_BASE_URL$1"; }
          echo "site-wide operations of the account:"
          get '/rest/api/user/current?expand=operations' | jq -c '[.operations[]? | "\(.operation) \(.targetType)"] | unique'
          account=$(get '/rest/api/user/current' | jq -r '.accountId')
          echo "groups: count, and how many have admin in the name:"
          get "/rest/api/user/memberof?accountId=$account&limit=200" | jq -c '{groups: (.results | length), admin_named: ([.results[]? | select(.name | test("admin"; "i"))] | length), kinds: ([.results[]? | .name | if test("^site-admins$") then "site-admins" elif test("^org-admins$") then "org-admins" elif test("^confluence-admins") then "confluence-admins" elif test("^administrators$") then "administrators" else "other" end] | unique)}'
          echo "operations on the CLAUDEGRPC space:"
          get '/rest/api/space/CLAUDEGRPC?expand=operations' | jq -c '[.operations[]? | "\(.operation) \(.targetType)"] | unique'
          echo "edition fields of system info, if any:"
          get '/rest/api/settings/systemInfo' | jq -c 'with_entries(select(.key | test("edition|license|tier|plan"; "i")))' || true
