// One operation and the principals it is granted to.
message ContentPermissionGrant {
  // The operation.
  ContentPermissionOperation operation = 1;
  // The principals granted the operation.
  repeated ContentPermissionPrincipal principals = 2;
}

// Which spaces a bulk transition applies to.
enum BulkTransitionSpaceType {
  // Not set.
  BULK_TRANSITION_SPACE_TYPE_UNSPECIFIED = 0;
  // All spaces.
  BULK_TRANSITION_SPACE_TYPE_ALL = 1;
  // All spaces except personal spaces.
  BULK_TRANSITION_SPACE_TYPE_ALL_EXCEPT_PERSONAL = 2;
  // All spaces except the selected ones.
  BULK_TRANSITION_SPACE_TYPE_ALL_EXCEPT_SPECIFIC = 3;
  // Personal spaces.
  BULK_TRANSITION_SPACE_TYPE_PERSONAL = 4;
  // The selected spaces.
  BULK_TRANSITION_SPACE_TYPE_SPECIFIC = 5;
}

// One space of a bulk transition selection.
message BulkTransitionSpaceTarget {
  // ID of the space.
  string id = 1;
  // Key of the space.
  string key = 2;
}

// The spaces a bulk transition applies to.
message BulkTransitionSpaceSelection {
  // How the spaces are selected.
  BulkTransitionSpaceType space_type = 1;
  // The selected spaces, for SPECIFIC and ALL_EXCEPT_SPECIFIC.
  repeated BulkTransitionSpaceTarget selected_spaces = 2;
}

// What happens to one principal type holding a permission combination.
message BulkTransitionPrincipalTypeAssignment {
  // The principal type.
  BulkTransitionPrincipalType principal_type = 1;
  // Removes access instead of assigning a role.
  bool remove_access = 2;
  // ID of the role to assign.
  optional string role_id = 3;
}

// The role assignments for one permission combination.
message BulkTransitionRoleAssignment {
  // ID of the permission combination.
  string permission_combination_id = 1;
  // The assignment per principal type.
  repeated BulkTransitionPrincipalTypeAssignment principal_type_assignments = 2;
}

// A started bulk transition task.
message BulkTransitionTask {
  // ID of the task.
  string task_id = 1;
  // Status of the task.
  BulkTransitionTaskStatus status = 2;
  // URL that reports the task status.
  string status_url = 3;
}

// One text range to redact.
message RedactionPointer {
  // JSON pointer to the text node holding the text.
  string pointer = 1;
  // Zero-based index of the first character to redact.
  int32 from = 2;
  // Zero-based index after the last character to redact.
  int32 to = 3;
  // Reason for the redaction.
  optional string reason = 4;
}

// Why a Mutate operation failed.
enum MutateErrorCode {
  // Not set.
  MUTATE_ERROR_CODE_UNSPECIFIED = 0;
  // The operation was malformed or rejected as invalid.
  MUTATE_ERROR_CODE_INVALID_ARGUMENT = 1;
  // The credentials may not perform the operation.
  MUTATE_ERROR_CODE_PERMISSION_DENIED = 2;
  // The target does not exist or is not visible.
  MUTATE_ERROR_CODE_NOT_FOUND = 3;
  // The target changed since expected_version, or the operation conflicts
  // with its state.
  MUTATE_ERROR_CODE_CONFLICT = 4;
  // Confluence rate-limited the operation.
  MUTATE_ERROR_CODE_THROTTLED = 5;
  // Confluence could not be reached.
  MUTATE_ERROR_CODE_UNAVAILABLE = 6;
  // Any other failure.
  MUTATE_ERROR_CODE_INTERNAL = 7;
  // The connection is not usable.
  MUTATE_ERROR_CODE_FAILED_PRECONDITION = 8;
}

// The failure of one Mutate operation.
message MutateError {
  // The kind of failure.
  MutateErrorCode code = 1;
  // Description of the failure.
  string message = 2;
  // HTTP status Confluence answered with; 0 when it did not answer.
  int32 http_status = 3;
  // How long to wait before retrying, when Confluence said so.
  google.protobuf.Duration retry_after = 4;
}

// The first frame of an upload: where the file goes and what it is.
message UploadAttachmentHeader {
  // Catalog connection to use; empty for the process default.
  string connection_id = 1;
  // ID of the content the file is attached to.
  string content_id = 2;
  // Name of the file.
  string file_name = 3;
  // Media type of the file; empty for application/octet-stream.
  string media_type = 4;
  // Comment stored with the attachment version.
  string comment = 5;
  // Marks the upload as a minor edit, which sends no notifications.
  bool minor_edit = 6;
  // Adds a new version when an attachment with this file name exists.
  bool replace_existing = 7;
}

// The last frame of an upload.
message UploadAttachmentEnd {}

// One frame of an attachment upload: the header, then chunks, then the end.
message UploadAttachmentRequest {
  // The frame.
  oneof frame {
    // Where the file goes and what it is; the first frame.
    UploadAttachmentHeader header = 1;
    // The next bytes of the file.
    bytes chunk = 2;
    // Marks the file complete; the last frame.
    UploadAttachmentEnd end = 3;
  }
}

// Progress of an upload.
message UploadAttachmentProgress {
  // Bytes of the file received so far.
  int64 bytes_received = 1;
}

// One event of an attachment upload.
message UploadAttachmentResponse {
  // The event.
  oneof event {
    // Bytes received so far; sent after each chunk.
    UploadAttachmentProgress progress = 1;
    // The stored attachment; the last event.
    Attachment attachment = 2;
  }
}

// Request of UpdatePage.
message UpdatePageRequest {
  // Catalog connection to use; empty for the process default.
  string connection_id = 1;
  // ID of the page.
  string id = 2;
  // Status of the page: current or draft.
  ContentStatus status = 3;
  // Title of the page.
  string title = 4;
  // ID of the containing space.
  string space_id = 5;
  // ID of the new parent content.
  string parent_id = 6;
  // Account ID of the new page owner.
  string owner_id = 7;
  // Body of the page.
  ContentBody body = 8;
  // The current version number; the update is sent as this plus one.
  int32 expected_version = 9;
  // Message stored with the new version.
  string version_message = 10;
}

// Response of UpdatePage.
