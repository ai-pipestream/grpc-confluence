syntax = "proto3";

package ai.pipestream.confluence.v1;

import "ai/pipestream/confluence/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.confluence.v1";

// ============================================================================
// PROPERTIES - Content Properties, Space Properties, App Properties.
//
// A property is a typed key-value pair, not a bag of JSON. The key is a
// PropertyKey (the REST-edge mapper translates the API's string keys; that
// translation is documented here, not the schema's concern) and the value is
// a PropertyValue oneof whose arm matches the value's actual type.
// Structured values (objects and arrays, at any depth) are the schema's own
// recursive PropertyValue tree, never google.protobuf.Struct: integers stay
// integers, object keys keep their source order, and duplicate keys are kept
// as separate entries instead of being merged.
// ============================================================================

// A well-known Confluence property key. CUSTOM is the escape hatch: when the
// key is CUSTOM, the property's custom_key carries the API's raw key string.
enum PropertyKey {
  // Zero value; the key is unknown or was not returned.
  PROPERTY_KEY_UNSPECIFIED = 0;
  // The editor a page was last edited with ("editor").
  PROPERTY_KEY_EDITOR = 1;
  // The published content appearance ("content-appearance-published").
  PROPERTY_KEY_CONTENT_APPEARANCE_PUBLISHED = 2;
  // The draft content appearance ("content-appearance-draft").
  PROPERTY_KEY_CONTENT_APPEARANCE_DRAFT = 3;
  // Any other key; see the property's custom_key.
  PROPERTY_KEY_CUSTOM = 99;
}

// A typed property value: one JSON value, recursively. The set arm matches
// the value's actual JSON type, and objects and arrays nest further
// PropertyValues, so any JSON document maps without loss and without
// google.protobuf.Struct. An unset oneof means the API returned no value.
message PropertyValue {
  // Removed google.protobuf.Struct / ListValue arms (json_value = 5,
  // json_list_value = 6); replaced by object_value and list_value.
  reserved 5, 6;
  reserved "json_value", "json_list_value";

  // The typed value; the set arm matches the value's actual type.
  oneof value {
    // JSON string.
    string string_value = 1;
    // JSON integer (a number token with no fraction or exponent) that fits
    // in a signed 64-bit integer.
    int64 integer_value = 2;
    // JSON true or false.
    bool bool_value = 3;
    // JSON number with a fraction or exponent, as an IEEE 754 double.
    double double_value = 4;
    // JSON null, stated explicitly (distinct from an unset oneof, which
    // means no value was returned).
    PropertyNull null_value = 7;
    // JSON array: its elements in source order.
    PropertyList list_value = 8;
    // JSON object: its members in source order.
    PropertyObject object_value = 9;
    // JSON integer outside the signed 64-bit range, kept exactly as its
    // canonical base-10 digits (an optional leading '-', no leading zeros),
    // so no precision is lost to a double.
    string big_integer_value = 10;
  }
}

// The JSON null value. Carries no fields; its presence in
// PropertyValue.null_value is the value.
message PropertyNull {}

// A JSON array of property values.
message PropertyList {
  // The array's elements, in source order.
  repeated PropertyValue values = 1;
}

// A JSON object, as an ordered list of members rather than a map, so member
// order is preserved and duplicate keys are kept instead of silently merged.
message PropertyObject {
  // The object's members, in source order.
  repeated PropertyEntry entries = 1;
}

// One member of a JSON object.
message PropertyEntry {
  // The member name, exactly as in the source.
  string key = 1;
  // The member value.
  PropertyValue value = 2;
}

// A content property (typed key-value metadata attached to content).
message ContentProperty {

  // ID of the property.
  string id = 1;
  // The property key.
  PropertyKey key = 2;
  // The API's raw key string. Set only when key is CUSTOM.
  string custom_key = 3;
  // The property value.
  PropertyValue value = 4;
  // Version of the property.
  Version version = 5;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// The version block of a space property.
message SpacePropertyVersion {
  // When the property's current version was created.
  google.protobuf.Timestamp created_at = 1;
  // Account ID of the user that created the current version.
  string created_by = 2;
  // Message associated with the current version.
  string message = 3;
  // The space property's current version number.
  int32 number = 4;
}

// A space property (typed key-value metadata attached to a space).
message SpaceProperty {

  // ID of the space property.
  string id = 1;
  // The property key.
  PropertyKey key = 2;
  // The API's raw key string. Set only when key is CUSTOM.
  string custom_key = 3;
  // The property value.
  PropertyValue value = 4;
  // When the property was created.
  google.protobuf.Timestamp created_at = 5;
  // Account ID of the user that created the space property.
  string created_by = 6;
  // The property's current version.
  SpacePropertyVersion version = 7;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// A Forge app property: typed key-value state stored by a Forge app.
message AppProperty {
  // The property key.
  PropertyKey key = 1;
  // The API's raw key string. Set only when key is CUSTOM.
  string custom_key = 2;
  // The property value.
  PropertyValue value = 3;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
