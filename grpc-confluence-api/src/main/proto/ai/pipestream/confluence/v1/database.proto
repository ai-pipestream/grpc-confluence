syntax = "proto3";

package ai.pipestream.confluence.v1;

import "ai/pipestream/confluence/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.confluence.v1";
option java_outer_classname = "DatabaseProto";

// ============================================================================
// DATABASE DATA - the fields (schema), entries (rows) and views of a
// Confluence database (Database group: GET /databases/{id}/fields,
// /entries, /entries/{entryId}, /views). The Database container itself
// lives in content.proto; these messages are its tabular content.
//
// Upstream marks these endpoints experimental. Values are typed per field
// kind (a oneof, never a JSON blob); rich text travels as a BodyType in
// atlas_doc_format, consistent with every other body in this package.
// ============================================================================

// The kind of a database field (column).
enum DatabaseFieldType {
  // Zero value; the field type is unknown or was not returned.
  DATABASE_FIELD_TYPE_UNSPECIFIED = 0;
  // Plain or rich text.
  DATABASE_FIELD_TYPE_TEXT = 1;
  // An AI-generated summary.
  DATABASE_FIELD_TYPE_AI_SUMMARY = 2;
  // A number with a display format.
  DATABASE_FIELD_TYPE_NUMBER = 3;
  // A boolean checkbox.
  DATABASE_FIELD_TYPE_CHECKBOX = 4;
  // A date or date-time.
  DATABASE_FIELD_TYPE_DATE = 5;
  // One or more options from a configured list.
  DATABASE_FIELD_TYPE_SELECT = 6;
  // One or more hyperlinks.
  DATABASE_FIELD_TYPE_HYPERLINK = 7;
  // One or more Atlassian users.
  DATABASE_FIELD_TYPE_USER = 8;
  // One or more attachments (media ids).
  DATABASE_FIELD_TYPE_ATTACHMENT = 9;
  // One or more Jira issues.
  DATABASE_FIELD_TYPE_JIRA_ISSUE = 10;
  // One or more links to Confluence content.
  DATABASE_FIELD_TYPE_PAGE_LINK = 11;
  // One or more links to entries of this or another database.
  DATABASE_FIELD_TYPE_ENTRY_LINK = 12;
  // Lookup of a field on a linked entry (value always null on read).
  DATABASE_FIELD_TYPE_ENTRY_DETAILS = 13;
  // Entries of another database linking back to this one (value always
  // null on read).
  DATABASE_FIELD_TYPE_BACKLINK = 14;
  // Lookup of a page property on a linked page (value always null on read).
  DATABASE_FIELD_TYPE_PAGE_DETAILS = 15;
  // Labels of a linked page (value always null on read).
  DATABASE_FIELD_TYPE_PAGE_LABELS = 16;
  // Status of a linked page (value always null on read).
  DATABASE_FIELD_TYPE_PAGE_STATUS = 17;
  // Lookup of a Jira field on a linked issue (value always null on read).
  DATABASE_FIELD_TYPE_JIRA_ISSUE_DETAILS = 18;
}

// How a number field is displayed.
enum DatabaseNumberFormatType {
  // Zero value; the format is unknown or was not returned.
  DATABASE_NUMBER_FORMAT_TYPE_UNSPECIFIED = 0;
  // A plain number.
  DATABASE_NUMBER_FORMAT_TYPE_NUMBER = 1;
  // A percentage.
  DATABASE_NUMBER_FORMAT_TYPE_PERCENT = 2;
  // A currency amount.
  DATABASE_NUMBER_FORMAT_TYPE_CURRENCY = 3;
  // A custom prefix/suffix format.
  DATABASE_NUMBER_FORMAT_TYPE_CUSTOM = 4;
}

// The layout of a database view.
enum DatabaseViewType {
  // Zero value; the view type is unknown or was not returned.
  DATABASE_VIEW_TYPE_UNSPECIFIED = 0;
  // A table (grid) view.
  DATABASE_VIEW_TYPE_TABLE = 1;
  // A card gallery view.
  DATABASE_VIEW_TYPE_GALLERY = 2;
  // A kanban board view.
  DATABASE_VIEW_TYPE_BOARD = 3;
  // A calendar view.
  DATABASE_VIEW_TYPE_CALENDAR = 4;
  // A timeline view.
  DATABASE_VIEW_TYPE_TIMELINE = 5;
}

// Who last updated an AI summary value.
enum DatabaseAiSummaryUpdater {
  // Zero value; the updater is unknown or was not returned.
  DATABASE_AI_SUMMARY_UPDATER_UNSPECIFIED = 0;
  // The summary was generated by AI.
  DATABASE_AI_SUMMARY_UPDATER_AI = 1;
  // The summary was edited by a user.
  DATABASE_AI_SUMMARY_UPDATER_USER = 2;
}

// Display format of a number field.
message DatabaseNumberFormat {
  // The format kind.
  DatabaseNumberFormatType type = 1;
  // Display symbol before the value (e.g. "$").
  string prefix = 2;
  // Display symbol after the value (e.g. "%").
  string suffix = 3;
  // Explicit decimal precision; absent when using the format default.
  optional int32 decimal_places = 4;
}

// One configured option of a select field.
message DatabaseSelectOption {
  // Stable identifier of the option.
  string id = 1;
  // User-visible label of the option.
  string label = 2;
}

// Settings of a text field.
message DatabaseTextFieldSettings {
  // True when the field accepts rich text (ADF).
  bool rich_text = 1;
}

// Settings of an AI summary field.
message DatabaseAiSummaryFieldSettings {
  // Account ID of the user who last triggered the AI summary run.
  string last_ai_run_user_account_id = 1;
}

// Settings of a number field.
message DatabaseNumberFieldSettings {
  // The display format.
  DatabaseNumberFormat format = 1;
}

// Settings of a select field.
message DatabaseSelectFieldSettings {
  // Ordered list of configured options.
  repeated DatabaseSelectOption options = 1;
}

// Settings of a date field.
message DatabaseDateFieldSettings {
  // When true, values are offset-bearing date-times; when false, values are
  // plain `YYYY-MM-DD` dates.
  bool includes_time = 1;
}

// Settings of a Jira issue field.
message DatabaseJiraIssueFieldSettings {
  // Connected Jira Cloud site ID.
  string cloud_id = 1;
  // Connected Jira Server/Data Center site ID.
  string server_id = 2;
}

// Settings of an entry-details lookup field.
message DatabaseEntryDetailsFieldSettings {
  // The link field this lookup field derives from.
  string source_field_id = 1;
  // The field being looked up.
  string lookup_field_id = 2;
}

// Settings of a Jira-issue-details lookup field.
message DatabaseJiraIssueDetailsFieldSettings {
  // The Jira issue field this lookup derives from.
  string source_field_id = 1;
  // The selected Jira field key.
  string jira_field_key = 2;
}

// Settings of a page-details lookup field.
message DatabasePageDetailsFieldSettings {
  // The page-link field this lookup derives from.
  string source_field_id = 1;
  // The selected page property key.
  string page_property_key = 2;
}

// Settings of a lookup field that only names its source field (page labels,
// page status).
message DatabaseSourceFieldSettings {
  // The source field this lookup derives from.
  string source_field_id = 1;
}

// Settings of a backlink field.
message DatabaseBacklinkFieldSettings {
  // Confluence content ID of the source database.
  string source_database_content_id = 1;
}

// A field (column) definition of a database. The settings arm matches
// `type`; field types without type-specific settings (checkbox, hyperlink,
// user, attachment, page link, entry link) set no arm.
message DatabaseField {
  // Stable identifier of the field. Entry values are keyed by this id.
  string id = 1;
  // User-visible field name.
  string name = 2;
  // User-set field description.
  string description = 3;
  // The kind of the field.
  DatabaseFieldType type = 4;
  // Type-specific settings; the set arm matches `type`.
  oneof settings {
    // Settings when type is TEXT.
    DatabaseTextFieldSettings text = 10;
    // Settings when type is AI_SUMMARY.
    DatabaseAiSummaryFieldSettings ai_summary = 11;
    // Settings when type is NUMBER.
    DatabaseNumberFieldSettings number = 12;
    // Settings when type is SELECT.
    DatabaseSelectFieldSettings select = 13;
    // Settings when type is DATE.
    DatabaseDateFieldSettings date = 14;
    // Settings when type is JIRA_ISSUE.
    DatabaseJiraIssueFieldSettings jira_issue = 15;
    // Settings when type is ENTRY_DETAILS.
    DatabaseEntryDetailsFieldSettings entry_details = 16;
    // Settings when type is JIRA_ISSUE_DETAILS.
    DatabaseJiraIssueDetailsFieldSettings jira_issue_details = 17;
    // Settings when type is PAGE_DETAILS.
    DatabasePageDetailsFieldSettings page_details = 18;
    // Settings when type is PAGE_LABELS or PAGE_STATUS.
    DatabaseSourceFieldSettings source = 19;
    // Settings when type is BACKLINK.
    DatabaseBacklinkFieldSettings backlink = 20;
  }
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// Metadata of an AI summary value.
message DatabaseAiSummaryValueMetadata {
  // When the summary was last updated.
  google.protobuf.Timestamp last_updated_at = 1;
  // Whether AI or a user last updated the summary.
  DatabaseAiSummaryUpdater last_updated_by = 2;
  // Account ID of the user associated with the last update.
  string last_updated_user_account_id = 3;
}

// A text value: plain text plus the rich (ADF) document.
message DatabaseTextValue {
  // The plain-text rendering.
  string plain = 1;
  // The rich text as a serialized ADF document (format ATLAS_DOC_FORMAT).
  BodyType rich = 2;
}

// An AI summary value.
message DatabaseAiSummaryValue {
  // The plain-text rendering of the summary.
  string plain = 1;
  // The rich summary as a serialized ADF document (format ATLAS_DOC_FORMAT).
  BodyType rich = 2;
  // Provenance of the summary.
  DatabaseAiSummaryValueMetadata summary_metadata = 3;
}

// One hyperlink of a hyperlink value.
message DatabaseHyperlinkItem {
  // The URL.
  string url = 1;
  // Display label of the link.
  string label = 2;
}

// A reference to a Jira issue.
message DatabaseJiraIssueRef {
  // The issue key (e.g. `ENG-42`).
  string key = 1;
  // Jira Cloud site ID the issue lives on.
  string cloud_id = 2;
  // Jira Server/Data Center site ID the issue lives on.
  string server_id = 3;
}

// A reference to an entry of this or another database.
message DatabaseEntryRef {
  // ID of the referenced entry.
  string entry_id = 1;
  // Content ID of the database the entry belongs to. Absent when the entry
  // is in the same database.
  string database_content_id = 2;
}

// A select value: the chosen options.
message DatabaseSelectValue {
  // The selected options.
  repeated DatabaseSelectOption options = 1;
}

// A hyperlink value: the links.
message DatabaseHyperlinkValue {
  // The links.
  repeated DatabaseHyperlinkItem items = 1;
}

// A user value: the referenced accounts.
message DatabaseUserValue {
  // Account IDs of the referenced users.
  repeated string account_ids = 1;
}

// An attachment value: the referenced media.
message DatabaseAttachmentValue {
  // Media IDs of the referenced attachments.
  repeated string media_ids = 1;
}

// A Jira issue value: the referenced issues.
message DatabaseJiraIssueValue {
  // The referenced issues.
  repeated DatabaseJiraIssueRef issues = 1;
}

// A page-link value: the referenced Confluence content.
message DatabasePageLinkValue {
  // Content IDs of the referenced pages (or other content).
  repeated string content_ids = 1;
}

// An entry-link value: the referenced database entries.
message DatabaseEntryLinkValue {
  // The referenced entries.
  repeated DatabaseEntryRef entries = 1;
}

// The value of one field on one entry. `type` is always set; the value arm
// is unset when the cell is empty (upstream returns a null value) and for
// the lookup-derived field types, which never carry a value on read.
message DatabaseFieldValue {
  // The field kind the value belongs to.
  DatabaseFieldType type = 1;
  // The typed value; unset when the cell is empty.
  oneof value {
    // Value when type is TEXT.
    DatabaseTextValue text = 10;
    // Value when type is AI_SUMMARY.
    DatabaseAiSummaryValue ai_summary = 11;
    // Value when type is NUMBER: a canonical finite decimal string,
    // locale-invariant (kept as a string to preserve precision).
    string number = 12;
    // Value when type is CHECKBOX.
    bool checkbox = 13;
    // Value when type is DATE: an ISO date (`YYYY-MM-DD`) or an offset-bearing
    // date-time, per the field's `includes_time` setting. Kept as a string
    // because date-only values have no instant.
    string date = 14;
    // Value when type is SELECT.
    DatabaseSelectValue select = 15;
    // Value when type is HYPERLINK.
    DatabaseHyperlinkValue hyperlink = 16;
    // Value when type is USER.
    DatabaseUserValue user = 17;
    // Value when type is ATTACHMENT.
    DatabaseAttachmentValue attachment = 18;
    // Value when type is JIRA_ISSUE.
    DatabaseJiraIssueValue jira_issue = 19;
    // Value when type is PAGE_LINK.
    DatabasePageLinkValue page_link = 20;
    // Value when type is ENTRY_LINK.
    DatabaseEntryLinkValue entry_link = 21;
  }
}

// One entry (row) of a database.
message DatabaseEntry {
  // Stable identifier of the entry.
  string id = 1;
  // Confluence content ID of the parent database.
  string database_id = 2;
  // Field values keyed by field id. Every field of the database is present;
  // an empty cell is a value with `type` set and no value arm.
  map<string, DatabaseFieldValue> values = 3;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// A named view on a database. Only identity, name and layout are exposed
// upstream; view configuration (filters, grouping) is not.
message DatabaseView {
  // Stable identifier of the view.
  string id = 1;
  // User-visible view name.
  string name = 2;
  // The layout of the view.
  DatabaseViewType type = 3;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
