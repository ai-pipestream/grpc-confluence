syntax = "proto3";

package ai.pipestream.confluence.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.confluence.v1";

// ============================================================================
// LABEL AND LIKE
// ============================================================================

// A content label.
message Label {
  // ID of the label.
  string id = 1;
  // Name of the label.
  string name = 2;
  // Prefix of the label (e.g. "global", "my", "team").
  string prefix = 3;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// A like on a piece of content.
message Like {
  // Account ID of the user who liked the content.
  string account_id = 1;
}
