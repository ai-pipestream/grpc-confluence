// ============================================================================
// ATTACHMENTS
// ============================================================================

// Request to read one attachment.
message GetAttachmentRequest {
  // ID of the attachment.
  string id = 1;
  // When true, the binary is downloaded through the client's download path
  // and inlined as Attachment.content. There is no fixed cap: the only limit
  // is `max_content_bytes` when the caller sets one. Bulk bytes are better
  // served by DownloadAttachment, which streams.
  bool include_content = 2;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 3;
  // Optional ceiling for an inlined binary; 0 = no cap. When set and the
  // attachment's file_size exceeds it, the rpc fails with FAILED_PRECONDITION
  // and the caller should use DownloadAttachment instead.
  int64 max_content_bytes = 4;
  // A previously published version number to retrieve instead of the current
  // version.
  optional int32 version = 5;
  // The expansions to include (labels, properties, operations, versions).
  ContentIncludes include = 6;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// The requested attachment (metadata always; bytes when include_content).
message GetAttachmentResponse {
  // The attachment: metadata always, bytes when include_content was set.
  Attachment attachment = 1;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// Attachments of one container (page, blog post, custom content, or label),
// or of the whole workspace when no container is set.
message ListAttachmentsRequest {
  // Page id to list. Exactly one of page_id, blog_post_id,
  // custom_content_id, label_id selects the container; when several are set
  // the first in that order wins; none = every attachment (GET /attachments).
  string page_id = 1;
  // Blog post id to list when page_id is empty.
  string blog_post_id = 2;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 3;
  // Custom content id to list when page_id and blog_post_id are empty.
  string custom_content_id = 4;
  // Label id to list (GET /labels/{id}/attachments) when no content
  // container is set.
  string label_id = 5;
  // Only attachments in these statuses; empty = the API default (current and
  // archived).
  repeated ContentStatus statuses = 6;
  // Only attachments of this media type.
  string media_type = 7;
  // Only attachments with this file name.
  string filename = 8;
  // Sort order; unset = the API default.
  SortOrder sort = 9;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One streamed attachment of the requested container.
message ListAttachmentsResponse {
  // The streamed attachment (metadata; bytes are not inlined on this rpc).
  Attachment attachment = 1;
}

// Request to stream one attachment's binary.
message DownloadAttachmentRequest {
  // ID of the attachment.
  string id = 1;
  // A previously published version number to download instead of the
  // current version.
  optional int32 version = 2;
  // Preferred size in bytes of each streamed chunk (one gRPC message of the
  // download stream). This is gRPC framing, not a Confluence parameter:
  // the server reads the file from Confluence and re-chunks it.
  // 0 = the server implementation default. Unrelated to max_bytes.
  int32 chunk_bytes = 3;
  // Optional ceiling on the total file size, across all chunks; 0 = no cap. When set and
  // the attachment's file_size exceeds it, the rpc fails with
  // FAILED_PRECONDITION before any chunk is sent.
  int64 max_bytes = 4;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 5;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One message of an attachment download stream: the first message carries
// the metadata, every following message carries a chunk of the binary, in
// order. Concatenating the chunks yields the file.
message DownloadAttachmentResponse {
  // The streamed part: metadata first, then chunks.
  oneof part {
    // The attachment metadata (content unset); always the first message.
    Attachment attachment = 1;
    // One chunk of the binary.
    bytes data = 2;
  }
}

// Request to stream one attachment's rendered thumbnail.
message DownloadAttachmentThumbnailRequest {
  // ID of the attachment.
  string id = 1;
  // A previously published version number whose thumbnail to download
  // instead of the current version's.
  optional int32 version = 2;
  // Requested thumbnail width in pixels; 0 = the API default. Negative is
  // INVALID_ARGUMENT.
  int32 width = 3;
  // Requested thumbnail height in pixels; 0 = the API default. Negative is
  // INVALID_ARGUMENT.
  int32 height = 4;
  // Preferred size in bytes of each streamed chunk (gRPC framing, not a
  // Confluence parameter); 0 = the server implementation default.
  // Unrelated to max_bytes.
  int32 chunk_bytes = 5;
  // Optional ceiling on the total thumbnail size, across all chunks;
  // 0 = no cap. When the media host declares a larger Content-Length the
  // rpc fails with FAILED_PRECONDITION before any message is sent; when
  // the bytes outgrow it mid-stream the rpc fails with FAILED_PRECONDITION.
  int64 max_bytes = 6;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 7;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// What the thumbnail download resolved to, sent before the bytes. The
// route is a redirect with no JSON body, so this carries only what the
// final HTTP response declares.
message AttachmentThumbnail {
  // ID of the attachment the thumbnail belongs to (echoed from the request).
  string attachment_id = 1;
  // The thumbnail's media type, from the media host's Content-Type; empty
  // when it sent none.
  string media_type = 2;
  // The thumbnail's size in bytes, from the media host's Content-Length;
  // 0 when it did not declare one (chunked transfer).
  int64 size_bytes = 3;
}

// One message of a thumbnail download stream: the first message carries
// the descriptor, every following message carries a chunk of the binary,
// in order. Concatenating the chunks yields the image.
message DownloadAttachmentThumbnailResponse {
  // The streamed part: descriptor first, then chunks.
  oneof part {
    // What the download resolved to; always the first message.
    AttachmentThumbnail thumbnail = 1;
    // One chunk of the binary.
    bytes data = 2;
  }
}

