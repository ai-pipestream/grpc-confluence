// Request to stream custom content of one type.
message ListCustomContentRequest {
  // The custom content type (required by every v2 custom-content list
  // route).
  string type = 1;
  // Optional content container: a page or blog post
  // (GET /{pages|blogposts}/{id}/custom-content). A space is named by
  // `space_id` instead, because ContentType has no space kind. Unset (and
  // space_id empty) = the whole workspace (GET /custom-content).
  ContentRef container = 2;
  // Only these custom content ids (workspace scope only).
  repeated string ids = 3;
  // Only custom content in these spaces (workspace scope only; a filter on
  // GET /custom-content, unlike `space_id`, which selects the space route).
  repeated string space_ids = 4;
  // The body representation to fetch. UNSPECIFIED = metadata-only listing.
  BodyFormat body_format = 5;
  // Sort order; unset = the API default. GET /spaces/{id}/custom-content
