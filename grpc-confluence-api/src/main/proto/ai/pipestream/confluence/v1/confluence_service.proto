syntax = "proto3";

package ai.pipestream.confluence.v1;

import "ai/pipestream/confluence/v1/admin_key.proto";
import "ai/pipestream/confluence/v1/attachment.proto";
import "ai/pipestream/confluence/v1/blogpost.proto";
import "ai/pipestream/confluence/v1/classification.proto";
import "ai/pipestream/confluence/v1/comment.proto";
import "ai/pipestream/confluence/v1/common.proto";
import "ai/pipestream/confluence/v1/content.proto";
import "ai/pipestream/confluence/v1/database.proto";
import "ai/pipestream/confluence/v1/events.proto";
import "ai/pipestream/confluence/v1/operation.proto";
import "ai/pipestream/confluence/v1/label.proto";
import "ai/pipestream/confluence/v1/page.proto";
import "ai/pipestream/confluence/v1/permission.proto";
import "ai/pipestream/confluence/v1/property.proto";
import "ai/pipestream/confluence/v1/space.proto";
import "ai/pipestream/confluence/v1/task.proto";
import "ai/pipestream/confluence/v1/user.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.confluence.v1";

// ============================================================================
// CONFLUENCE SERVICE - the gRPC facade over the Confluence crawler.
//
// A thin read proxy: every rpc delegates to the crawler core (REST v2 client,
// mapper, crawl orchestration) and answers in the parity domain model, so a
// gRPC client (or an agent reflecting over the descriptor set) can read the
// workspace and stream changes without knowing the REST API exists. REST
// pagination is transport and stays hidden: list rpcs stream, and Sync emits
// the crawler's change envelopes plus a resume cursor for the next pass.
//
// Scope: the READ surface of Confluence Cloud REST API v2 (one rpc per v2
// read route family; the v2 route is named on each rpc). Writes (create /
// update / delete, redactions, admin keys, permission mutation, space
// permission transition tasks) are deliberately absent: this is an indexer's
// proxy. Permission *reads* are in scope because search security trimming
// needs them, and so is every other v2 read route (likes, version details,
// operations, the space permission catalogue and transition reads, the
// caller's admin key, Forge app properties, the email access check): the
// contract covers the whole v2 read surface.
//
// Streaming responses carry one entity per message in a per-rpc wrapper
// (ListPagesResponse, SyncResponse, ...) rather than the bare domain message:
// buf STANDARD's RPC_RESPONSE_STANDARD_NAME / RPC_REQUEST_RESPONSE_UNIQUE
// require it, and the wrapper leaves room for stream-level fields later
// without a wire break.
//
// Per-content sub-resources (properties, versions, likes, permissions,
// children, ...) take a ContentRef {type, id} that maps to the v2
// `{content-type}/{id}` path segment; the server answers INVALID_ARGUMENT
// when the API has no such route for that content kind.
//
// Bulk bytes: there is no fixed payload cap anywhere in this contract.
// DownloadAttachment streams chunks; a caller that wants a ceiling sets an
// optional per-request limit (0 = no cap). Any default beyond that is server
// configuration, never a contract constant.
// ============================================================================

// The Confluence read proxy. Server reflection and the gRPC health service
// are always registered alongside it, so the surface is discoverable with
// grpcurl-style tooling or any descriptor-driven client.
service ConfluenceService {
  // -------------------------------------------------------------- spaces --

  // Every space the credentials can see, or only the requested keys/ids,
  // optionally filtered by type, status and labels.
  // v2: GET /spaces.
  // Deprecated: use StreamSpaces. Kept unary for wire compatibility.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {
    option deprecated = true;
  }

  // Every space the credentials can see, or only the requested keys/ids,
  // optionally filtered by type, status and labels, as a stream; the stream
  // hides the REST cursor pagination. Supersedes the unary ListSpaces.
  // v2: GET /spaces.
  rpc StreamSpaces(StreamSpacesRequest) returns (stream StreamSpacesResponse);

  // One space by id (or by key, resolved through GET /spaces?keys=), with the
  // requested expansions (icon, operations, space properties, permissions,
  // role assignments, labels).
  // v2: GET /spaces/{id}.
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);

  // ------------------------------------------------ pages and blog posts --

  // One page by id, with its body in the requested format, optionally a
  // historical version or the draft, and the requested expansions.
  // v2: GET /pages/{id}.
  rpc GetPage(GetPageRequest) returns (GetPageResponse);

  // One blog post by id, with its body in the requested format, optionally a
  // historical version or the draft, and the requested expansions.
  // v2: GET /blogposts/{id}.
  rpc GetBlogPost(GetBlogPostRequest) returns (GetBlogPostResponse);

  // Pages of a space, of the workspace, or carrying a label, as a stream; the
  // stream hides the REST cursor pagination.
  // v2: GET /pages, GET /spaces/{id}/pages, GET /labels/{id}/pages.
  rpc ListPages(ListPagesRequest) returns (stream ListPagesResponse);

  // Blog posts of a space, of the workspace, or carrying a label, as a
  // stream; the stream hides the REST cursor pagination.
  // v2: GET /blogposts, GET /spaces/{id}/blogposts, GET /labels/{id}/blogposts.
  rpc ListBlogPosts(ListBlogPostsRequest) returns (stream ListBlogPostsResponse);

  // --------------------------------------------------------- attachments --

  // One attachment's metadata, plus its bytes inlined when requested. For
  // large binaries prefer DownloadAttachment, which streams.
  // v2: GET /attachments/{id} (+ the download link it names).
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);

  // Attachments of a page, blog post, custom content, or label, or every
  // attachment of the workspace, as a stream of metadata.
  // v2: GET /attachments, GET /pages/{id}/attachments,
  // GET /blogposts/{id}/attachments, GET /custom-content/{id}/attachments,
  // GET /labels/{id}/attachments.
  rpc ListAttachments(ListAttachmentsRequest) returns (stream ListAttachmentsResponse);

  // The binary of one attachment as a stream: the metadata first, then the
  // bytes in chunks. No fixed size cap; the caller may set one per request.
  // v2: GET /attachments/{id} then the download link (media CDN redirect
  // followed server-side).
  rpc DownloadAttachment(DownloadAttachmentRequest) returns (stream DownloadAttachmentResponse);

  // The rendered thumbnail of one attachment as a stream: a descriptor
  // first (media type and, when the media host declares it, the size), then
  // the bytes in chunks. Same framing and ceiling rules as
  // DownloadAttachment: no fixed size cap, the caller may set one.
  // v2: GET /attachments/{id}/thumbnail/download (302 to the media CDN,
  // followed server-side).
  rpc DownloadAttachmentThumbnail(DownloadAttachmentThumbnailRequest) returns (stream DownloadAttachmentThumbnailResponse);

  // ------------------------------------------------------------ comments --

  // Footer and/or inline comments of a page, blog post, attachment or custom
  // content; the replies of one comment; or every comment of the workspace,
  // as a stream.
  // v2: GET /{content-type}/{id}/footer-comments,
  // GET /{pages|blogposts}/{id}/inline-comments,
  // GET /{footer|inline}-comments/{id}/children, GET /footer-comments,
  // GET /inline-comments.
  rpc ListComments(ListCommentsRequest) returns (stream ListCommentsResponse);

  // One footer or inline comment by id, with its body in the requested
  // format and the requested expansions.
  // v2: GET /footer-comments/{id}, GET /inline-comments/{id}.
  rpc GetComment(GetCommentRequest) returns (GetCommentResponse);

  // ------------------------------------------------------ custom content --

  // Custom content of one type, across the workspace or within a space, page
  // or blog post, as a stream.
  // v2: GET /custom-content, GET /spaces/{id}/custom-content,
  // GET /pages/{id}/custom-content, GET /blogposts/{id}/custom-content.
  rpc ListCustomContent(ListCustomContentRequest) returns (stream ListCustomContentResponse);

  // One piece of custom content by id.
  // v2: GET /custom-content/{id}.
  rpc GetCustomContent(GetCustomContentRequest) returns (GetCustomContentResponse);

  // ----------------------------------- whiteboards, databases, folders, --
  // ----------------------------------- smart links and the content tree --

  // One whiteboard by id. v2: GET /whiteboards/{id}.
  rpc GetWhiteboard(GetWhiteboardRequest) returns (GetWhiteboardResponse);

  // One database (the container) by id. v2: GET /databases/{id}.
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse);

  // One folder by id. v2: GET /folders/{id}.
  rpc GetFolder(GetFolderRequest) returns (GetFolderResponse);

  // One Smart Link in the content tree by id. v2: GET /embeds/{id}.
  rpc GetSmartLink(GetSmartLinkRequest) returns (GetSmartLinkResponse);

  // The direct children of a page, whiteboard, database, folder, Smart Link
  // or custom content in the content tree, as a stream.
  // v2: GET /{content-type}/{id}/direct-children,
  // GET /custom-content/{id}/children.
  rpc ListChildren(ListChildrenRequest) returns (stream ListChildrenResponse);

  // The descendants of a page, whiteboard, database, folder or Smart Link,
  // top-down to the requested depth, as a stream.
  // v2: GET /{content-type}/{id}/descendants.
  rpc ListDescendants(ListDescendantsRequest) returns (stream ListDescendantsResponse);

  // The ancestors of a page, whiteboard, database, folder or Smart Link,
  // top-down (highest first), as a stream; the server follows the API's
  // walk-up pagination.
  // v2: GET /{content-type}/{id}/ancestors.
  rpc ListAncestors(ListAncestorsRequest) returns (stream ListAncestorsResponse);

  // ------------------------------------------------------ database data --

  // The field (column) definitions of a database, in column order, as a
  // stream. Upstream marks this experimental.
  // v2: GET /databases/{id}/fields.
  rpc ListDatabaseFields(ListDatabaseFieldsRequest) returns (stream ListDatabaseFieldsResponse);

  // The entries (rows) of a database, optionally filtered and sorted, as a
  // stream. Upstream marks this experimental and its pagination best-effort
  // while the database is changing.
  // v2: GET /databases/{id}/entries.
  rpc ListDatabaseEntries(ListDatabaseEntriesRequest) returns (stream ListDatabaseEntriesResponse);

  // One entry (row) of a database. Upstream marks this experimental.
  // v2: GET /databases/{id}/entries/{entryId}.
  rpc GetDatabaseEntry(GetDatabaseEntryRequest) returns (GetDatabaseEntryResponse);

  // The views defined on a database (id, name and layout type only; the
  // API does not expose view configuration), as a stream. Upstream marks
  // this experimental. Entry reads are not view-scoped upstream, so a view
  // is descriptive metadata, not a filter for ListDatabaseEntries.
  // v2: GET /databases/{id}/views.
  rpc ListDatabaseViews(ListDatabaseViewsRequest) returns (stream ListDatabaseViewsResponse);

  // -------------------------------------------------------------- labels --

  // Labels of the workspace, of a space, of a space's content, or of one
  // piece of content, as a stream.
  // v2: GET /labels, GET /spaces/{id}/labels, GET /spaces/{id}/content/labels,
  // GET /{content-type}/{id}/labels.
  rpc ListLabels(ListLabelsRequest) returns (stream ListLabelsResponse);

  // ------------------------------------------------------------ versions --

  // The version history of a page, blog post, attachment, comment or custom
  // content, each entry carrying its snapshot of the entity, as a stream.
  // v2: GET /{content-type}/{id}/versions.
  rpc ListVersions(ListVersionsRequest) returns (stream ListVersionsResponse);

  // The change-set detail of one version of a page, blog post, attachment,
  // comment or custom content (collaborators, previous and next version
  // numbers, whether the content type changed).
  // v2: GET /{content-type}/{id}/versions/{version-number}.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // --------------------------------------------------------------- likes --

  // The accounts that liked a page, blog post or comment, as a stream.
  // v2: GET /{pages|blogposts|footer-comments|inline-comments}/{id}/likes/users.
  rpc ListLikes(ListLikesRequest) returns (stream ListLikesResponse);

  // The number of likes of a page, blog post or comment.
  // v2: GET /{pages|blogposts|footer-comments|inline-comments}/{id}/likes/count.
  rpc GetLikeCount(GetLikeCountRequest) returns (GetLikeCountResponse);

  // ---------------------------------------------------------- operations --

  // Every operation the calling user may perform on one content item or
  // space. Unlike the include.operations preview on the Get rpcs (capped
  // upstream at 50 entries) this is the full, unpaginated list.
  // v2: GET /{content-type}/{id}/operations, GET /spaces/{id}/operations.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);

  // --------------------------------------------------------------- tasks --

  // Inline tasks of the workspace, filtered by status, container, people and
  // date ranges, as a stream.
  // v2: GET /tasks.
  rpc ListTasks(ListTasksRequest) returns (stream ListTasksResponse);

  // One inline task by id. v2: GET /tasks/{id}.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // --------------------------------------------------------------- users --

  // User profiles for a set of account ids (the only v2 user lookup). The
  // server chunks the request to the API's per-call maximum (250 ids, the
  // request body's maxItems). The route declares no cursor or limit, so a
  // response is complete for its chunk; its `_links` schema is the shared
  // MultiEntityLinks, whose `next` is never followed here (a relative GET
  // URL cannot continue a POST). Should the API ever send one, the rpc
  // fails with INTERNAL rather than return a silently partial result.
  // v2: POST /users-bulk (a read; the body is just the id list).
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);

  // Which of the given email addresses have no access to the site, and
  // which are not valid addresses. The server chunks the request to the
  // API's per-call maximum (100 emails).
  // v2: POST /user/access/check-access-by-email (a read; the body is just
  // the email list).
  rpc CheckAccessByEmail(CheckAccessByEmailRequest) returns (CheckAccessByEmailResponse);

  // ------------------------------------------------------ classification --

  // The classification levels defined for the site.
  // v2: GET /classification-levels.
  rpc ListClassificationLevels(ListClassificationLevelsRequest) returns (ListClassificationLevelsResponse);

  // The classification level applied to a page, blog post, database or
  // whiteboard, or a space's default classification level.
  // v2: GET /{content-type}/{id}/classification-level,
  // GET /spaces/{id}/classification-level/default.
  rpc GetClassificationLevel(GetClassificationLevelRequest) returns (GetClassificationLevelResponse);

  // The data-policy view of spaces (whether content is blocked for the
  // calling app), as a stream. Both data-policy rpcs are served upstream to
  // app (Connect/Forge) credentials only; with API-token auth they fail
  // with PERMISSION_DENIED. Kept so the contract tracks the upstream API.
  // v2: GET /data-policies/spaces.
  rpc ListDataPolicySpaces(ListDataPolicySpacesRequest) returns (stream ListDataPolicySpacesResponse);

  // Workspace-level data-policy metadata.
  // v2: GET /data-policies/metadata.
  rpc GetDataPolicyMetadata(GetDataPolicyMetadataRequest) returns (GetDataPolicyMetadataResponse);

  // ---------------------------------------------------------- properties --

  // Content properties of a page, blog post, attachment, comment, custom
  // content, whiteboard, database, folder or Smart Link, as a stream (one
  // property by key via the request's `key` filter).
  // v2: GET /{content-type}/{id}/properties (comments of either kind:
  // GET /comments/{id}/properties).
  rpc ListContentProperties(ListContentPropertiesRequest) returns (stream ListContentPropertiesResponse);

  // Space properties of a space, as a stream (one property by key via the
  // request's `key` filter).
  // v2: GET /spaces/{id}/properties.
  rpc ListSpaceProperties(ListSpacePropertiesRequest) returns (stream ListSpacePropertiesResponse);

  // One content property by its id (not its key; filter
  // ListContentProperties by `key` for that).
  // v2: GET /{content-type}/{id}/properties/{property-id} (comments of
  // either kind: GET /comments/{id}/properties/{property-id}).
  rpc GetContentProperty(GetContentPropertyRequest) returns (GetContentPropertyResponse);

  // One space property by its id.
  // v2: GET /spaces/{id}/properties/{property-id}.
  rpc GetSpaceProperty(GetSpacePropertyRequest) returns (GetSpacePropertyResponse);

  // The Forge app properties of the calling app, as a stream. Upstream
  // serves the app-properties routes to Forge app (asApp) credentials
  // only; with API-token auth they fail (PERMISSION_DENIED or NOT_FOUND).
  // Kept so the contract tracks the upstream API.
  // v2: GET /app/properties.
  rpc ListAppProperties(ListAppPropertiesRequest) returns (stream ListAppPropertiesResponse);

  // One Forge app property by key. Forge app credentials only, like
  // ListAppProperties.
  // v2: GET /app/properties/{propertyKey}.
  rpc GetAppProperty(GetAppPropertyRequest) returns (GetAppPropertyResponse);

  // ----------------------------------------- permissions (read side only) --

  // The direct restriction state of a page, blog post, database, whiteboard
  // or folder.
  // v2: GET /{content-type}/{id}/restriction-state.
  rpc GetRestrictionState(GetRestrictionStateRequest) returns (GetRestrictionStateResponse);

  // The direct user/group permission entries of a page, blog post, database,
  // whiteboard or folder, as a stream.
  // v2: GET /{content-type}/{id}/permissions.
  rpc ListContentPermissions(ListContentPermissionsRequest) returns (stream ListContentPermissionsResponse);

  // The space permission assignments of one space, as a stream.
  // v2: GET /spaces/{id}/permissions.
  rpc ListSpacePermissionAssignments(ListSpacePermissionAssignmentsRequest) returns (stream ListSpacePermissionAssignmentsResponse);

  // The space roles available on the tenant (or for one space / principal),
  // as a stream. Role-based-access tenants only.
  // v2: GET /space-roles.
  rpc ListSpaceRoles(ListSpaceRolesRequest) returns (stream ListSpaceRolesResponse);

  // One space role by id. Role-based-access tenants only.
  // v2: GET /space-roles/{id}.
  rpc GetSpaceRole(GetSpaceRoleRequest) returns (GetSpaceRoleResponse);

  // The tenant's catalogue of space permission definitions (id, display
  // name, description, prerequisites), as a stream.
  // v2: GET /space-permissions.
  rpc ListSpacePermissions(ListSpacePermissionsRequest) returns (stream ListSpacePermissionsResponse);

  // The unassigned space permission combinations found by the last
  // transition audit, as a stream (admin tooling for the move to space
  // roles; Confluence administrators only).
  // v2: GET /space-permissions/transition/combinations.
  rpc ListSpacePermissionTransitionCombinations(ListSpacePermissionTransitionCombinationsRequest) returns (stream ListSpacePermissionTransitionCombinationsResponse);

  // The status of one submitted space permission transition task.
  // v2: GET /space-permissions/transition/tasks/{taskId}.
  rpc GetSpacePermissionTransitionTask(GetSpacePermissionTransitionTaskRequest) returns (GetSpacePermissionTransitionTaskResponse);

  // The role assignments of one space, as a stream. Role-based-access
  // tenants only.
  // v2: GET /spaces/{id}/role-assignments.
  rpc ListSpaceRoleAssignments(ListSpaceRoleAssignmentsRequest) returns (stream ListSpaceRoleAssignmentsResponse);

  // Whether the tenant uses classic space permissions, roles, or is in
  // transition. v2: GET /space-role-mode.
  rpc GetSpaceRoleMode(GetSpaceRoleModeRequest) returns (GetSpaceRoleModeResponse);

  // ----------------------------------------------------------- admin key --

  // The calling user's active admin key, if any (NOT_FOUND when none is
  // enabled). Reading it never enables, extends or disables one.
  // v2: GET /admin-key.
  rpc GetAdminKey(GetAdminKeyRequest) returns (GetAdminKeyResponse);

  // -------------------------------------------------------------- content --

  // The content kind of each given content id (for ids stored without their
  // type, e.g. from a webhook or a v1 migration).
  // v2: POST /content/convert-ids-to-types (a read; the body is the id list).
  rpc ResolveContentTypes(ResolveContentTypesRequest) returns (ResolveContentTypesResponse);

  // ------------------------------------------------------- sync and probe --

  // One bounded sync pass as a stream of ConfluenceChanges, closing with the
  // resume cursor for the next pass. Deliberately bounded (the resume-token
  // idiom): a continuously-tailing Watch rpc is a possible additive later,
  // not part of this surface.
  //
  // Security-trimming data fails closed: every access-control owner
  // (space, page, blog post, whiteboard, database, folder) and its
  // per-run restriction_state record carry
  // ConfluenceEntity.security_completeness; consumers should deny access
  // unless it is COMPLETE. The stream is flow-controlled: the server pages
  // the REST API only as fast as the client reads, and stops paging when
  // the client cancels.
  rpc Sync(SyncRequest) returns (stream SyncResponse);

  // Hit ListSpaces with a catalog connection (or inline credentials) and
  // report whether the token works. A future UI uses this as "Test
  // connection". Does not start a crawl.
  rpc ProbeConnection(ProbeConnectionRequest) returns (ProbeConnectionResponse);
}

// ============================================================================
// SHARED REQUEST VOCABULARY
// ============================================================================

// A field a list may be sorted by. The v2 API defines one sort enum per
// entity kind; this is their union, and the server answers INVALID_ARGUMENT
// when the chosen field is not sortable on that route.
enum SortField {
  // Zero value; the API's default order for the route.
  SORT_FIELD_UNSPECIFIED = 0;
  // By id.
  SORT_FIELD_ID = 1;
  // By creation date.
  SORT_FIELD_CREATED_DATE = 2;
  // By last modification date.
  SORT_FIELD_MODIFIED_DATE = 3;
  // By title.
  SORT_FIELD_TITLE = 4;
  // By position among siblings in the content tree.
  SORT_FIELD_CHILD_POSITION = 5;
  // By key (spaces, content properties).
  SORT_FIELD_KEY = 6;
  // By name (spaces, labels).
  SORT_FIELD_NAME = 7;
}

// The order of a list: a field and a direction (the API's `sort=[-]field`).
message SortOrder {
  // The field to sort by.
  SortField field = 1;
  // True for descending order; false (default) for ascending.
  bool descending = 2;
}

// The expansions a single-entity read may ask for (the API's `include-*`
// query flags). Flags the API does not offer for the requested content kind
// are ignored. The current version is always included. Upstream caps every
// expansion at 50 entries; the inlined lists are therefore a preview, never
// a complete set. Use the dedicated list rpc (ListLabels,
// ListContentProperties, ListVersions, ListChildren) for the full set.
message ContentIncludes {
  // Include the labels attached to the content.
  bool labels = 1;
  // Include the content properties attached to the content.
  bool properties = 2;
  // Include the operations the calling user may perform on the content.
  bool operations = 3;
  // Include the likes on the content.
  bool likes = 4;
  // Include the version history of the content.
  bool versions = 5;
  // Include whether the calling user has favorited the content.
  bool favorited_by_current_user = 6;
  // Include the direct children of the content in the content tree.
  bool direct_children = 7;
  // Include the account ids of the content's collaborators
  // (`include-collaborators`).
  bool collaborators = 8;
  // Include the web resources needed to render the body
  // (`include-webresources`; pages and blog posts only).
  bool web_resources = 9;
}

// The expansions a space read may ask for (GET /spaces/{id} `include-*`).
// Upstream caps every expansion at 50 entries, so the inlined lists are a
// preview: security trimming must use ListSpacePermissionAssignments and
// ListSpaceRoleAssignments, which page through the full set.
message SpaceIncludes {
  // Include the space icon.
  bool icon = 1;
  // Include the operations the calling user may perform on the space.
  bool operations = 2;
  // Include the space properties.
  bool properties = 3;
  // Include the space permission assignments.
  bool permissions = 4;
  // Include the space role assignments (role-based-access tenants; upstream
  // accepts this flag on EAP sites only).
  bool role_assignments = 5;
  // Include the labels attached to the space.
  bool labels = 6;
}

// The representation of a space description to fetch.
enum SpaceDescriptionFormat {
  // Zero value; no description is requested.
  SPACE_DESCRIPTION_FORMAT_UNSPECIFIED = 0;
  // The plain-text representation.
  SPACE_DESCRIPTION_FORMAT_PLAIN = 1;
  // The rendered view representation.
  SPACE_DESCRIPTION_FORMAT_VIEW = 2;
}

// The subtype of a page (GET /pages `subtype` filter).
enum PageSubtype {
  // Zero value; no subtype filter.
  PAGE_SUBTYPE_UNSPECIFIED = 0;
  // A live doc.
  PAGE_SUBTYPE_LIVE = 1;
  // A classic published page.
  PAGE_SUBTYPE_PAGE = 2;
}

// A label prefix (namespace).
enum LabelPrefix {
  // Zero value; no prefix filter.
  LABEL_PREFIX_UNSPECIFIED = 0;
  // A personal label.
  LABEL_PREFIX_MY = 1;
  // A team label.
  LABEL_PREFIX_TEAM = 2;
  // A global label.
  LABEL_PREFIX_GLOBAL = 3;
  // A system label.
  LABEL_PREFIX_SYSTEM = 4;
}

// ============================================================================
// SPACES
// ============================================================================

// Request to list spaces.
message ListSpacesRequest {
  // Space keys to include; empty = every space the credentials can see.
  repeated string keys = 1;
  // Maximum number of spaces to return; 0 = no cap (walks all REST pages).
  int32 limit = 2;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 3;
  // Space ids to include; combined with `keys` as the API combines them.
  repeated string ids = 4;
  // Only spaces of this type; UNSPECIFIED = any type.
  SpaceType type = 5;
  // Only spaces in this status; UNSPECIFIED = the API default (current).
  SpaceStatus status = 6;
  // Only spaces carrying all of these labels.
  repeated string labels = 7;
  // Only spaces favorited by this account id.
  string favorited_by = 8;
  // Only spaces NOT favorited by this account id.
  string not_favorited_by = 9;
  // Sort order; unset = the API default (id ascending).
  SortOrder sort = 10;
  // The description representation to fetch; UNSPECIFIED = none.
  SpaceDescriptionFormat description_format = 11;
  // Include each space's icon.
  bool include_icon = 12;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// The spaces the request matched.
message ListSpacesResponse {
  // The matched spaces.
  repeated Space spaces = 1;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// Request to stream spaces (same filters as ListSpacesRequest).
message StreamSpacesRequest {
  // Space keys to include; empty = every space the credentials can see.
  repeated string keys = 1;
  // Maximum number of spaces to return; 0 = no cap.
  int32 limit = 2;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 3;
  // Space ids to include; combined with `keys` as the API combines them.
  repeated string ids = 4;
  // Only spaces of this type; UNSPECIFIED = any type.
  SpaceType type = 5;
  // Only spaces in this status; UNSPECIFIED = the API default (current).
  SpaceStatus status = 6;
  // Only spaces carrying all of these labels.
  repeated string labels = 7;
  // Only spaces favorited by this account id.
  string favorited_by = 8;
  // Only spaces NOT favorited by this account id.
  string not_favorited_by = 9;
  // Sort order; unset = the API default (id ascending).
  SortOrder sort = 10;
  // The description representation to fetch; UNSPECIFIED = none.
