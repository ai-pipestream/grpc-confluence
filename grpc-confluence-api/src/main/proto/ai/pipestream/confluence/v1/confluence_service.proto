  // The scope of the listing; unset = the whole workspace.
  oneof scope {
    // Labels attached to this space (GET /spaces/{id}/labels).
    string space_id = 1;
    // Labels attached to the content of this space
    // (GET /spaces/{id}/content/labels).
    string content_space_id = 2;
    // Labels attached to this page, blog post, attachment or custom content
    // (GET /{content-type}/{id}/labels).
    ContentRef content = 3;
  }
  // Only these label ids (workspace scope only).
  repeated string label_ids = 4;
  // Only labels with these prefixes; empty = the API default for the route.
  // GET /labels takes the list in one call. The scoped routes
  // (space, space content, one content item) take a single `prefix`, so
  // with several prefixes the server walks the route once per distinct
  // prefix, in request order, and concatenates the streams. A label has
  // exactly one prefix, so the union has no duplicates; `sort` then
  // orders within each prefix's run, not across the whole stream.
  repeated LabelPrefix prefixes = 5;
  // Sort order; unset = the API default.
  SortOrder sort = 6;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 7;
