// COMMENTS
// ============================================================================

// Request to stream comments. Scope resolution, in order: `parent_comment_id`
// set = the replies of that comment; else `container` set = the root
// comments of that page, blog post, attachment or custom content; else every
// comment of the workspace.
// `version` applies to an attachment container only.
message ListCommentsRequest {
  // The content whose root comments to list (page, blog post, attachment,
  // custom content). Inline comments exist on pages and blog posts only.
  ContentRef container = 1;
  // The comment whose replies to list.
  string parent_comment_id = 2;
  // Footer, inline, or both.
  CommentKind kind = 3;
  // The body representation to fetch per comment. UNSPECIFIED = metadata-only
  // listing.
  BodyFormat body_format = 4;
  // Only comments in these statuses; empty = the API default.
  repeated ContentStatus statuses = 5;
  // Only inline comments in these resolution statuses; empty = any.
  repeated InlineCommentResolutionStatus resolution_statuses = 6;
  // Sort order; unset = the API default.
  SortOrder sort = 7;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 8;
  // The attachment version whose footer comments to list. Only
  // GET /attachments/{id}/footer-comments accepts it (int64 per the spec);
  // with any other scope it is INVALID_ARGUMENT. Unset = the current
  // version.
  optional int64 version = 9;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One streamed comment.
message ListCommentsResponse {
  // The streamed comment.
  Comment comment = 1;
}

// Request to read one comment.
message GetCommentRequest {
  // ID of the comment.
  string id = 1;
  // Footer or inline (the two live on different routes). UNSPECIFIED = the
  // server tries footer, then inline.
  CommentKind kind = 2;
  // The body representation to fetch. UNSPECIFIED = BODY_FORMAT_STORAGE_XHTML.
  BodyFormat body_format = 3;
  // A previously published version number to retrieve instead of the current
  // version.
  optional int32 version = 4;
  // The expansions to include (properties, operations, likes, versions).
  ContentIncludes include = 5;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 6;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// The requested comment.
message GetCommentResponse {
  // The requested comment.
  Comment comment = 1;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

