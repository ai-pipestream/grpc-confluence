// ============================================================================
// DATABASE DATA
// ============================================================================

// A comparison operator of a database entry filter.
enum DatabaseEntryFilterOperator {
  // Zero value; treated as EQUALS.
  DATABASE_ENTRY_FILTER_OPERATOR_UNSPECIFIED = 0;
  // Equals the single value (`eq:`).
  DATABASE_ENTRY_FILTER_OPERATOR_EQUALS = 1;
  // Equals any of the values (`in:`).
  DATABASE_ENTRY_FILTER_OPERATOR_IN = 2;
  // The cell is empty (`$empty`); takes no values.
  DATABASE_ENTRY_FILTER_OPERATOR_EMPTY = 3;
  // Greater than the single value (date and number fields).
  DATABASE_ENTRY_FILTER_OPERATOR_GREATER_THAN = 4;
  // Greater than or equal to the single value (date and number fields).
  DATABASE_ENTRY_FILTER_OPERATOR_GREATER_THAN_OR_EQUAL = 5;
  // Less than the single value (date and number fields).
  DATABASE_ENTRY_FILTER_OPERATOR_LESS_THAN = 6;
  // Less than or equal to the single value (date and number fields).
  DATABASE_ENTRY_FILTER_OPERATOR_LESS_THAN_OR_EQUAL = 7;
}

// One filter on database entries (the API's `filter[fieldId]=...`). Filters
// combine with AND. Which operators a field supports depends on its type;
// the API rejects unsupported combinations.
message DatabaseEntryFilter {
  // ID of the field to filter on.
  string field_id = 1;
  // The comparison operator.
  DatabaseEntryFilterOperator operator = 2;
  // The comparison values, in the field's canonical string form (one value
  // for every operator but IN, which takes several; none for EMPTY).
  repeated string values = 3;
}

// Sort of database entries by one field.
message DatabaseEntrySort {
  // ID of the field to sort by.
  string field_id = 1;
  // True for descending order; false (default) for ascending.
  bool descending = 2;
}

// Request to stream the field definitions of a database.
message ListDatabaseFieldsRequest {
  // Content ID of the database.
  string database_id = 1;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 2;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One streamed field definition, in column order.
message ListDatabaseFieldsResponse {
  // The streamed field.
  DatabaseField field = 1;
}

// Request to stream the entries of a database.
message ListDatabaseEntriesRequest {
  // Content ID of the database.
  string database_id = 1;
  // Filters to apply (AND).
  repeated DatabaseEntryFilter filters = 2;
  // Sort order; unset = the API default.
  DatabaseEntrySort sort = 3;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 4;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One streamed entry.
message ListDatabaseEntriesResponse {
  // The streamed entry.
  DatabaseEntry entry = 1;
}

// Request to read one database entry.
message GetDatabaseEntryRequest {
  // Content ID of the database.
  string database_id = 1;
  // ID of the entry.
  string entry_id = 2;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 3;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// The requested entry.
message GetDatabaseEntryResponse {
  // The requested entry.
  DatabaseEntry entry = 1;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

