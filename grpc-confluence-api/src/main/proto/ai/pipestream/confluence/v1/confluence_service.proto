  SortOrder sort = 6;
  // Catalog connection to use. Empty = the process-default (env) connection.
  string connection_id = 7;
  // Space whose custom content to list (GET /spaces/{id}/custom-content).
  // Mutually exclusive with `container`; setting both is INVALID_ARGUMENT,
  // and `ids` / `space_ids` / `sort` are not accepted by this route.
  string space_id = 8;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// One streamed piece of custom content.
