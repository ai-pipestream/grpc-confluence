// ============================================================================
// SYNC AND PROBE
// ============================================================================

// Request to run one bounded sync pass.
message SyncRequest {
  // Space keys to sync; empty = the server's configured allowlist, or every
  // space the credentials can see when none is configured.
  repeated string space_keys = 1;
  // The resume cursor a previous Sync ended with (an RFC3339 timestamp).
  // Empty = full crawl; set = incremental pass emitting only content modified
  // after the cursor. Restriction and permission changes do not bump a
  // content version, so an incremental pass still re-reads the security
  // data of every in-scope owner. Its cost on top of the changed content:
  // per space, the space permission and role assignment lists, and one
  // metadata-only (no body) list walk each of pages and blog posts; per
  // unchanged page or blog post, GET restriction-state plus the
  // permissions pages (emitted as permission entries and the owner's
  // restriction_state marker); per unchanged page, a direct-children walk,
  // and per whiteboard, database, folder or Smart Link below it one GET
  // plus its two security reads. Such a node is re-emitted, and a
  // database's fields and entries re-read, only when its version is newer
  // than the cursor. Bodies, comments, attachments, labels and properties of
  // unchanged content are not re-read.
  string since_cursor = 2;
  // When false, page, blog post, and comment bodies are stripped from the
  // streamed changes (metadata-only sync; the crawl still runs the same
  // sweep).
  bool include_bodies = 3;
  // Catalog connection to crawl. Empty = the process-default (env) connection.
  string connection_id = 4;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// Request to probe whether a catalog (or inline) connection can list spaces.
message ProbeConnectionRequest {
  // Catalog connection to probe. Empty = use inline fields or the process
  // default.
  string connection_id = 1;
  // Inline base URL for a probe that has not been saved yet.
  string base_url = 2;
  // Inline email for an unsaved probe.
  string email = 3;
  // Inline API token for an unsaved probe. Never logged or echoed.
  string token = 4;
  // Max spaces to return as evidence the token works; 0 = 5.
  int32 limit = 5;
}

// Result of a connection probe (ListSpaces succeeded or failed).
message ProbeConnectionResponse {
  // True when ListSpaces succeeded.
  bool ok = 1;
  // Catalog id that was probed; empty for a purely inline probe.
  string connection_id = 2;
  // Space keys the token can see (capped by the request limit).
  repeated string space_keys = 3;
  // Failure detail when ok is false. Never contains the token.
  string error_message = 4;
}

// One streamed sync event. The stream is exactly one bounded pass: zero or
// more change events, one snapshot per completed space sweep on a full crawl,
// then one terminal resume_cursor. Clients persist the resume cursor and hand
// it back as SyncRequest.since_cursor for the next incremental pass.
message SyncResponse {
  // The streamed event: exactly one of a change, a snapshot, or the terminal
  // resume cursor.
  oneof event {
    // One entity upsert from the pass.
    ConfluenceChange change = 1;
    // Full-crawl marker for one completed space sweep, carrying its per-space
    // cursor and entity counts.
    ConfluenceSnapshot snapshot = 2;
    // Terminal message of every Sync stream: the cursor to pass back as
    // since_cursor next time (the newest modification observed; empty when
    // the pass observed nothing).
    string resume_cursor = 3;
  }
}

